# Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for branch-based Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          branch_deploy_seen=false

          for attempt in {1..36}; do
            state="$(
              gh api "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&event=dynamic&per_page=20" \
                --jq '.workflow_runs[] | select(.name == "pages build and deployment") | .status' \
                | head -n 1
            )"

            if [ "$state" = "completed" ]; then
              echo "Branch-based Pages deployment has settled."
              exit 0
            fi

            if [ -n "$state" ]; then
              branch_deploy_seen=true
            elif [ "$branch_deploy_seen" = false ] && [ "$attempt" -ge 6 ]; then
              echo "No branch-based Pages deployment detected."
              exit 0
            fi

            sleep 5
          done

          echo "::warning::Timed out waiting for the branch-based Pages deployment."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
